<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>공연 캘린더 · POPOK Knowledge</title>
  <meta name="description" content="POPOK Knowledge에 기록된 공연을 월간 캘린더로 확인합니다." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Source+Sans+Pro:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- Absolute paths: this page is also served at /calendar/ via a Netlify
       rewrite (content/_redirects) that proxies through to this file's real
       location without changing the browser URL, so a relative "./" would
       resolve against /calendar/ and 404. -->
  <link rel="stylesheet" href="/static/calendar/calendar.css" />
</head>
<body>
  <div class="cal-page">
    <header class="cal-header">
      <a class="cal-back" href="/">← POPOK Knowledge</a>
      <div class="cal-heading">
        <h1>공연 캘린더</h1>
        <p class="cal-subtitle">공연 시작일 기준으로 표시됩니다</p>
      </div>
      <button class="cal-theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <nav class="cal-filters" id="filters" aria-label="장르 필터">
      <button class="chip is-active" data-category="DANCE"><span class="chip-dot" data-cat="무용"></span>무용</button>
      <button class="chip" data-category="ALL">전체</button>
    </nav>

    <main class="cal-main">
      <div id="calendar" class="cal-calendar"></div>
      <div id="cal-status" class="cal-status" hidden></div>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-handle" id="drawer-handle"></div>
    <div class="drawer-head">
      <h2 id="drawer-date"></h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="닫기">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/ko.global.min.js"></script>
  <script src="/static/calendar/calendar.js"></script>
</body>
</html>
